name: Secure RDP Advanced

on:
  workflow_dispatch:

jobs:
  secure-rdp-job:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: 1. Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "SecurityLayer" -Value 0 -Force
          
          $rule = Get-NetFirewallRule -Name "RDP-Tailscale" -ErrorAction SilentlyContinue
          if ($rule) { Remove-NetFirewallRule -Name "RDP-Tailscale" }
          New-NetFirewallRule -Name "RDP-Tailscale" -DisplayName "Allow RDP" -Direction Inbound -Protocol TCP -LocalPort 3389 -Action Allow
          Restart-Service -Name "TermService" -Force

      - name: 2. Create RDP User with Secure Password
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{               Upper   = [char[]](65..90)               Lower   = [char[]](97..122)               Number  = [char[]](48..57)               Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))           }$rawPassword = @()
          $rawPassword +=$charSet.Upper | Get-Random -Count 4
          $rawPassword +=$charSet.Lower | Get-Random -Count 4
          $rawPassword +=$charSet.Number | Get-Random -Count 4
          $rawPassword +=$charSet.Special | Get-Random -Count 4
          
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $password =$password.ToString()
          
          $securePass = ConvertTo-SecureString -String "$password" -AsPlainText -Force
          
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV

      - name: 3. Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "C:\tailscale.msi"
          
          Invoke-WebRequest -Uri "$tsUrl" -OutFile "$installerPath"
          Start-Process -FilePath "msiexec.exe" -ArgumentList "/i `"$installerPath`" /quiet /norestart" -Wait
          Remove-Item -Path "$installerPath" -Force

      - name: 4. Establish Tailscale Connection
        run: |
          $tailscaleExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          $authKey = "${{ secrets.TAILSCALE_AUTH_KEY }}"
          $hostName = "gh-runner-$env:GITHUB_RUN_ID"
          
          & $tailscaleExe up --authkey="$authKey" --hostname="$hostName"
          
          $tsIP = $null$retries = 0
          while (-not $tsIP -and$retries -lt 12) {
              $tsIP = &$tailscaleExe ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
      
      - name: 5. Verify RDP Accessibility
        run: |
          $targetIP =$env:TAILSCALE_IP
          Write-Host "Checking TCP connectivity for IP: $targetIP on Port 3389"
          $testResult = Test-NetConnection -ComputerName "$targetIP" -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: 6. Maintain Connection
        run: |
          Write-Host "`n============================="
          Write-Host "      RDP ACCESS READY       "
          Write-Host "============================="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "$(echo $env:RDP_CREDS)"
          Write-Host "=============================`n"
          
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Runner is running..."
              Start-Sleep -Seconds 300
          }
