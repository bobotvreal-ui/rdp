name: Ayush Final RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: 1. Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          
      - name: 2. Create User
        run: |
          $Password = "Ayush@12345678"
          $SecurePassword = ConvertTo-SecureString -String $Password -AsPlainText -Force
          New-LocalUser -Name "ayush" -Password $SecurePassword -FullName "Ayush RDP" -Description "RDP User"
          Add-LocalGroupMember -Group "Administrators" -Member "ayush"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "ayush"
          
      - name: 3. Install Tailscale
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec.exe -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          
      - name: 4. Connect Tailscale
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" --hostname="ayush-rdp-server"
          
      - name: 5. Show Details
        run: |
          Start-Sleep -Seconds 10
          $IP = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "============== RDP DETAILS =============="
          Write-Host "IP Address: $IP"
          Write-Host "Username:   ayush"
          Write-Host "Password:   Ayush@12345678"
          Write-Host "========================================="
          
      - name: 6. Keep Alive
        run: |
          while ($true) { Start-Sleep -Seconds 300 }
