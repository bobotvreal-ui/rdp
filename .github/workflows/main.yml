name: Secure RDP Fast

on:
  workflow_dispatch:

jobs:
  create-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
      - name: Create RDP User
        run: |
          $pass = "AlpGamer@12345"
          $securePass = ConvertTo-SecureString "$pass" -AsPlainText -Force
          New-LocalUser -Name "rdpadmin" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "rdpadmin"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "rdpadmin"
          
      - name: Download & Install Tailscale
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec.exe -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          
      - name: Start Tailscale
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" --hostname="github-runner"
          
      - name: Get IP & Credentials
        run: |
          Start-Sleep -Seconds 10
          $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "======================================"
          Write-Host "RDP Connection Details:"
          Write-Host "IP Address: $ip"
          Write-Host "Username: rdpadmin"
          Write-Host "Password: AlpGamer@12345"
          Write-Host "======================================"
          
      - name: Keep Alive
        run: |
          Write-Host "RDP is ready. Connect using the details above."
          while ($true) { Start-Sleep -Seconds 300 }
